---
# Configuration for Disposable Income Regression with Federated Learning

# Strategy selection: 'fedavg', 'fedprox', 'compare', 'compare_adaptive', or 'compare_stratified'
# - fedavg: Standard FedAvg
# - fedprox: Standard FedProx with single mu
# - compare: Base FedProx vs Static Multi-Layer FedProx
# - compare_adaptive: 3-way comparison (Base vs Static vs Adaptive Multi-Layer)
# - compare_stratified: Random vs Stratified Client Selection
strategy: compare_stratified # Options: fedavg, fedprox, compare, compare_adaptive, compare_stratified

# Reproducibility seed - ensures identical results across runs
# Change this value to test statistical significance across different random initializations
seed: 42

num_rounds: 10
num_clients: 14 # 14 clients for pure tier partitioning (4 Tier_1 + 6 Tier_2 + 4 Tier_3)
batch_size: 32
input_dim: 19 # 12 numerical + 7 one-hot encoded features
num_clients_per_round_fit: 4 # Number of clients participating in each training round
num_clients_per_round_eval: 4 # Number of clients participating in each evaluation round
non_iid: true # Pure tier partitioning - each client gets data from ONLY one tier

# Stratified Client Selection Configuration
use_stratified_selection: true # Enable stratified client selection
min_clients_per_stratum: 1 # Minimum clients to select from each stratum (fairness guarantee)

# Pure tier partitioning configuration
# Each client receives data from ONLY one tier (maximum heterogeneity)
# Client distribution:
#   - Tier_1: 4 clients
#   - Tier_2: 6 clients
#   - Tier_3: 4 clients
# This creates the most heterogeneous scenario for testing stratified selection

# Training configuration
config_fit:
  lr: 0.001 # Reduced from 0.01 for better stability with deeper network
  momentum: 0.0 # Can be set to 0.9 if using SGD with momentum
  local_epochs: 5

# Base FedProx configuration (uniform mu - baseline for comparison)
# Using moderate mu to show the benefit of layer-specific adaptation
fedprox_base:
  mu: 0.1 # Uniform mu across all layers - moderate regularization
  lr: 0.01 # Same learning rate as other strategies for fair comparison
  name: "Base FedProx (μ=0.1)" # For plotting labels

# FedAvg configuration (for stratified comparison)
fedprox:
  lr: 0.001 # Learning rate
  name: "FedAvg"

# Multi-layer FedProx configuration (static per-layer mu)
fedprox_multilayer:
  mu: 0.01 # Base mu as fallback
  lr: 0.01 # Same learning rate as other strategies for fair comparison
  layer_mus:
    input: 0.25 # Low mu for input layer - allows local feature learning
    hidden1: 0.30 # Moderate mu for first hidden layer
    hidden2: 0.35 # Higher mu for second hidden layer
    output: 0.40 # Highest mu for output layer - maintains global consistency
  name: "Static Multi-Layer FedProx"
  # Strategy: Lower mu on early layers (local adaptation),
  #           higher mu on later layers (global consistency)

# Adaptive Multi-layer FedProx configuration
# Uses dynamic mu values that change based on round number and layer divergence
# Key insight: Start with higher mu for global convergence, decay to allow local adaptation
fedprox_adaptive:
  # Schedule configuration - controls how mu changes over rounds
  schedule_type: cosine # Options: cosine, linear, warmup_decay, constant
  min_schedule_factor: 0.2 # Decay to 20% of initial mu by end of training
  warmup_rounds: 3 # Only used if schedule_type is warmup_decay

  # Divergence adaptation - adjusts mu based on how much layers drift from global model
  use_divergence: true # Enable divergence-based mu adjustment
  divergence_weight: 0.6 # Increased sensitivity to divergence

  # Mu bounds - prevents extreme values
  min_mu: 0.005 # Slightly higher floor to maintain some regularization
  max_mu: 0.3 # Allow higher mu early on

  # Name for plotting
  name: "Adaptive Multi-Layer FedProx"

# Plotting configuration
plotting:
  save_plots: true
  plot_format: png # png, pdf, svg
  figsize: [12, 8]
  dpi: 300

data_path: ./data/IndianPersonalFinance/indianPersonalFinanceAndSpendingHabits.csv
