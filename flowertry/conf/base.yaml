---
# Configuration for Disposable Income Regression with Federated Learning

# Strategy selection: 'fedavg', 'fedprox', or 'compare' (runs both base and multi-layer FedProx)
strategy: compare # Options: fedavg, fedprox, compare

num_rounds: 20
num_clients: 12 # 12 clients for Non-IID partitioning (4 clients per City_Tier)
batch_size: 32
input_dim: 19 # 12 numerical + 7 one-hot encoded features
num_clients_per_round_fit: 6 # Number of clients participating in each training round
num_clients_per_round_eval: 6 # Number of clients participating in each evaluation round
non_iid: true # Use Non-IID partitioning by City_Tier

# Data heterogeneity control (alpha parameter)
# alpha: Controls data heterogeneity across clients
#   - alpha = 0.0: Pure Non-IID (each client gets only one City_Tier) - Maximum heterogeneity
#   - alpha = 0.1: Highly heterogeneous (90% primary tier, 10% mixed)
#   - alpha = 0.5: Moderate heterogeneity (50% primary tier, 50% mixed)
#   - alpha = 1.0: Nearly IID (data well mixed across clients) - Low heterogeneity
alpha: 0.5 # Recommended: 0.1 for high heterogeneity, 0.3-0.5 for moderate

# Training configuration
config_fit:
  lr: 0.001 # Reduced from 0.01 for better stability with deeper network
  momentum: 0.0 # Can be set to 0.9 if using SGD with momentum
  local_epochs: 5

# Base FedProx configuration (uniform mu baseline)
fedprox_base:
  mu: 0.01 # Weak uniform regularization
  lr: 0.01
  name: "Base FedProx (μ=0.01)"

# Multi-layer FedProx configuration (aggressive per-layer mu)
# Goal: Much stronger regularization than baseline to prevent client drift
fedprox_multilayer:
  mu: 0.01 # Base mu as fallback
  lr: 0.01
  layer_mus:
    input: 0.25 # Very strong - keep input features consistent
    hidden1: 0.30 # Even stronger in hidden layers
    hidden2: 0.35 # Aggressive regularization
    output: 0.40 # Maximum regularization on output
  name: "Multi-Layer FedProx (Aggressive)"
  # Strategy: Much stronger regularization than baseline (0.01)
  #           to prevent client drift with alpha=0.5 heterogeneity

# Plotting configuration
plotting:
  save_plots: true
  plot_format: png # png, pdf, svg
  figsize: [12, 8]
  dpi: 300

data_path: ./data/IndianPersonalFinance/indianPersonalFinanceAndSpendingHabits.csv
