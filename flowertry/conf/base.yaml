---
# Federated Learning Configuration for Savings Potential Classification
# Dataset: Indian Personal Finance and Spending Habits
# Task: 3-class classification (Low/Medium/High savings potential)

num_rounds: 100 
num_clients: 20
batch_size: 8
num_classes: 3

num_clients_per_round_fit: 5
num_clients_per_round_eval: 5 # Must be <= num_clients (20)

# Data distribution parameters
iid: false # Set to true for IID, false for non-IID
alpha: 0.3 # Dirichlet parameter for non-IID (lower = more heterogeneous)
# Class weighting for imbalanced datasets
use_class_weights: true # Enable class weights to handle imbalanced classes
class_weight_method: "balanced" # 'balanced' (inverse frequency) or 'sqrt' (softer weighting)# 0.1 = very heterogeneous, 0.5 = moderate (better for seeing FedProx benefits), 1.0 = mild

# Strategy-specific parameters
proximal_mu: 0.5 # For fixed FedProx - typical range: 0.001-0.5

# FedSCAFFOLD parameters
scaffold_server_lr: 1.0 # Server-side learning rate for control variate updates (1.0 = full update)

# Adaptive FedProx parameters (simple loss-based adaptation)
adaptive_mu:
  enabled: true # Whether to use adaptive mu (true) or fixed mu (false)
  mode: "simple" # 'simple' for loss-based - more stable than multi_signal
  initial_mu: 0.1 # Starting mu value
  mu_min: 0.01 # Minimum allowed mu
  mu_max: 0.5 # Maximum allowed mu
  increase_factor: 1.2 # Multiply mu by this when loss increases
  decrease_factor: 0.95 # Multiply mu by this when loss decreases
  loss_threshold: 0.01 # Only adapt if loss change exceeds this
  warmup_rounds: 5 # Wait this many rounds before adapting

# Multi-Signal Adaptive FedProx parameters (HAPI-based heterogeneity-aware adaptation)
multi_signal_mu:
  base_mu: 0.1 # Base mu value before adaptation (start conservative)
  mu_min: 0.01 # Minimum allowed mu
  mu_max: 0.5 # Maximum allowed mu
  smoothing_factor: 0.8 # EMA smoothing for mu updates (0-1, higher = more smoothing)
  warmup_rounds: 5 # Wait this many rounds before adapting
  # Signal weights (should sum to ~1.0)
  weights:
    gradient_divergence: 0.4 # Weight for gradient/update divergence signal (most direct measure)
    loss_variance: 0.3 # Weight for loss variance signal
    label_entropy: 0.2 # Weight for label distribution skewness
    feature_variance: 0.1 # Weight for feature distribution heterogeneity

# Hybrid FedProx-SCAFFOLD parameters
# Combines FedProx (magnitude leash) with SCAFFOLD (direction correction)
hybrid:
  # Sequential Activation Strategy
  warmup_rounds: 10  # Phase 1: Pure SCAFFOLD for first N rounds (mu=0)
  mu_annealing_interval: 5  # Phase 2: Increase mu every N rounds
  mu_annealing_factor: 1.5  # Multiply mu by this factor each interval
  initial_mu: 0.001  # Starting mu after warmup (Phase 2 begins)
  max_mu: 0.3  # Maximum mu value
  
  # Dual-μ Architecture (separate μ for raw vs corrected components)
  use_dual_mu: true  # Enable separate μ for raw and SCAFFOLD-corrected components
  mu_raw: 0.1  # μ for uncorrected gradient component (stronger regularization)
  mu_corrected: 0.001  # μ for SCAFFOLD-corrected component (10-100x smaller)
  
  # Conditional Activation Based on Drift Type
  use_drift_detection: true  # Enable per-client drift-based activation
  direction_drift_threshold: 0.3  # Cosine distance threshold for direction drift
  magnitude_drift_threshold: 2.0  # L2 norm ratio threshold for magnitude drift
  
  # Legacy fixed mu (used if sequential/dual-mu disabled)
  proximal_mu: 0.1 # FedProx proximal term - controls "leash" strength (0.05-0.3 typical)

# Strategies to run in comparison (fedavg, fedprox, fedscaffold, hybrid)
strategies:
  - fedavg
  - fedprox
  - fedscaffold
  - hybrid

# Global training configuration (used as defaults for all strategies)
config_fit:
  lr: 0.005
  momentum: 0.9
  local_epochs: 3
  max_grad_norm: 1.0 # Maximum gradient norm for clipping (0.0 to disable, typical: 0.5-2.0)

# Strategy-specific configurations (override global config_fit if specified)
# Comment out or remove this section to use global config_fit for all strategies
strategy_configs:
  fedavg:
    lr: 0.01 # FedAvg can handle higher LR
    momentum: 0.5
    local_epochs: 3
    max_grad_norm: 1.0

  fedprox:
    lr: 0.005 # Lower LR for FedProx - proximal term provides regularization
    momentum: 0.5 # Lower momentum to reduce oscillation with proximal term
    local_epochs: 3 # Fewer epochs to prevent over-correction
    max_grad_norm: 1.0 # Standard gradient clipping

  fedscaffold:
    lr: 0.01 # Higher LR for SCAFFOLD - control variates correct drift
    momentum: 0.0 # No momentum for SCAFFOLD (control variates replace momentum's role)
    local_epochs: 5 # More local epochs to benefit from variance reduction
    max_grad_norm: 2.0 # Higher threshold for SCAFFOLD corrections

  hybrid:
    lr: 0.01 # Higher LR now that we have better drift control
    momentum: 0.0 # No momentum - control variates handle correction (like SCAFFOLD)
    local_epochs: 5 # More local epochs to benefit from variance reduction
    max_grad_norm: 2.0 # Higher threshold for combined corrections
