---
# Federated Learning Configuration for Savings Potential Classification
# Dataset: Indian Personal Finance and Spending Habits
# Task: 3-class classification (Low/Medium/High savings potential)

num_rounds: 50  # Increased to better observe FedProx benefits
num_clients: 100
batch_size: 32
num_classes: 3

num_clients_per_round_fit: 10
num_clients_per_round_eval: 25

# Data distribution parameters
iid: false  # Set to true for IID, false for non-IID
alpha: 0.3  # Dirichlet parameter for non-IID (lower = more heterogeneous)
            # 0.1 = very heterogeneous, 0.5 = moderate (better for seeing FedProx benefits), 1.0 = mild

# Strategy-specific parameters
proximal_mu: 0.1  # For fixed FedProx - typical range: 0.001-0.5
scaffold_lr: 1.0  # For FedSCAFFOLD

# Adaptive FedProx parameters (simple loss-based adaptation)
adaptive_mu:
  enabled: true           # Whether to use adaptive mu (true) or fixed mu (false)
  mode: 'multi_signal'     # 'simple' for loss-based, 'multi_signal' for HAPI-based
  initial_mu: 0.01        # Starting mu value (conservative start)
  mu_min: 0.001           # Minimum allowed mu
  mu_max: 0.5             # Maximum allowed mu
  increase_factor: 1.3    # Multiply mu by this when loss increases
  decrease_factor: 0.9    # Multiply mu by this when loss decreases
  loss_threshold: 0.01    # Only adapt if loss change exceeds this
  warmup_rounds: 3        # Wait this many rounds before adapting

# Multi-Signal Adaptive FedProx parameters (HAPI-based heterogeneity-aware adaptation)
multi_signal_mu:
  base_mu: 0.01            # Base mu value before adaptation (start conservative)
  mu_min: 0.001            # Minimum allowed mu
  mu_max: 1.0              # Maximum allowed mu
  smoothing_factor: 0.6    # EMA smoothing for mu updates (0-1, higher = more smoothing)
  warmup_rounds: 3         # Wait this many rounds before adapting
  # Signal weights (should sum to ~1.0)
  weights:
    gradient_divergence: 0.4   # Weight for gradient/update divergence signal (most direct measure)
    loss_variance: 0.25        # Weight for loss variance signal
    label_entropy: 0.2         # Weight for label distribution skewness
    feature_variance: 0.15     # Weight for feature distribution heterogeneity

# Strategies to run in comparison (fedavg, fedprox, fedscaffold)
strategies:
  - fedavg
  - fedprox
  # - fedscaffold

config_fit:
  lr: 0.01
  momentum: 0.9
  local_epochs: 20
  max_grad_norm: 1.0  # Maximum gradient norm for clipping (0.0 to disable, typical: 0.5-2.0)
