---
# Non-IID + FedAvg
# Heterogeneous data - FedAvg baseline (struggles with high heterogeneity)

num_rounds: 15
num_clients: 10
batch_size: 32

num_clients_per_round_fit: 5
num_clients_per_round_eval: 10

# More aggressive Non-IID Partitioning
# alpha=0.1 creates HIGH heterogeneity - each client dominated by 1-2 classes
partition_type: "dirichlet"
dirichlet_alpha: 0.1

# FedAvg Strategy
strategy: "fedavg"
fedprox_mu: 0.0

config_fit:
  lr: 0.01
  momentum: 0.9
  local_epochs: 5
