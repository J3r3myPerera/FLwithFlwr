---
# Simplified Configuration for Stratified Client Selection
# This config focuses only on stratified selection functionality

# Strategy selection
strategy: compare_stratified # Options: compare_stratified, stratified

# Reproducibility seed - ensures identical results across runs
# Change this value to test statistical significance across different random initializations
# Recommended seeds for multi-run experiments: 42, 43, 44, 45, 46
seed: 42

# Basic FL settings
num_rounds: 10
num_clients: 14 # 14 clients for pure tier partitioning (4 Tier_1 + 6 Tier_2 + 4 Tier_3)
batch_size: 32
input_dim: 19 # 12 numerical + 7 one-hot encoded features
num_clients_per_round_fit: 4 # Number of clients participating in each training round
num_clients_per_round_eval: 4 # Number of clients participating in each evaluation round
non_iid: true # Pure tier partitioning - each client gets data from ONLY one tier

# Pure tier partitioning configuration
# Each client receives data from ONLY one tier (maximum heterogeneity)
# Client distribution:
#   - Tier_1: 4 clients
#   - Tier_2: 6 clients
#   - Tier_3: 4 clients
# This creates the most heterogeneous scenario for testing stratified selection

# Training configuration
config_fit:
  lr: 0.001 # Learning rate
  momentum: 0.0 # SGD momentum (0.0 = no momentum)
  local_epochs: 5 # Number of local training epochs per round

# FedAvg configuration
fedprox:
  lr: 0.001 # Learning rate (overrides config_fit.lr if specified)
  name: "FedAvg"

# Stratified Client Selection Configuration
use_stratified_selection: true # Enable stratified client selection
min_clients_per_stratum: 1 # Minimum clients to select from each stratum (fairness guarantee)

# Plotting configuration
plotting:
  save_plots: true
  plot_format: png # png, pdf, svg
  figsize: [12, 8]
  dpi: 300

# Dataset path
data_path: ./data/IndianPersonalFinance/indianPersonalFinanceAndSpendingHabits.csv
