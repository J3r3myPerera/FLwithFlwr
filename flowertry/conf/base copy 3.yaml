# Federated Disposable Income Regression Configuration
# =============================================================================
# v6 ENHANCED HYBRID CONFIGURATION
#
# KEY FIX: SCAFFOLD decoupled from optimizer
# - SCAFFOLD corrections now applied AFTER optimizer.step() as parameter updates
# - This preserves Adam's momentum/variance estimates
# - Gentler layer-aware scaling (0.8x-1.2x instead of 0.5x-1.7x)
# - Simplified three-phase scheduling
#
# =============================================================================

num_rounds: 40
num_clients: 12
local_epochs: 5  # More local steps = more client drift (hurts FedAvg)
batch_size: 16   # Smaller batches = more gradient noise (hurts FedAvg)
learning_rate: 0.001  # v6: Conservative base LR (phase scheduling adjusts)

# =============================================================================
# STRATEGIES TO HURT FEDAVG WHILE FAVORING HYBRID
# =============================================================================
# 1. Client Subsampling: Keep only portion of data per client (increases gradient noise)
client_subsample_ratio: 0.4  # v6: Slightly increased for stability

# 2. Feature Reduction: Disable key engineered features (makes task harder)
use_engineered_features: false  # Removes Total_Expenses, Expense_to_Income_Ratio, Income_log

# 3. Lower Participation: Fewer clients per round = more variance between rounds
client_sampling:
  fraction_fit: 0.4       # v6: Moderate participation
  min_fit_clients: 4      # v6: Increased for stability
  fraction_evaluate: 0.4
  min_evaluate_clients: 2
  min_available_clients: 4

fedprox:
  mu: 0.1

scaffold:
  learning_rate_correction: 1.0

# =============================================================================
# v6 HYBRID STRATEGY PARAMETERS - Decoupled SCAFFOLD
# =============================================================================
hybrid:
  mu: 0.08                # v6: Lower base μ (layer scaling adds 0.8x-1.2x)
  fedprox_weight: 0.8     # v6: Balanced FedProx weight
  scaffold_weight: 0.7    # v6: Moderate SCAFFOLD (decoupled approach is more effective)

  warmup_rounds: 3        # Extended warmup for control variate initialization
  warmup_type: "linear"
  warmup_start_factor: 0.1

  use_warm_start: false  # v4: Disabled - was causing round 1 instability
  baseline_divergence: 1.0

  # EMA for control variates (smooths updates)
  use_control_ema: true
  control_ema_beta: 0.9   # v6: Balanced smoothing

  gradient_clip: true
  gradient_clip_norm: 1.0  # v6: Standard clipping

strategy_configs:
  fedavg:
    lr: 0.001
    local_epochs: 5
    max_grad_norm: 1.0

  fedprox:
    lr: 0.001
    local_epochs: 5
    max_grad_norm: 1.0

  scaffold:
    lr: 0.001
    local_epochs: 5
    max_grad_norm: 1.0

  hybrid:
    lr: 0.001             # v6: Same as others (phase scheduling adjusts)
    local_epochs: 5
    max_grad_norm: 1.0

iid: false
partition_strategy: hybrid

plotting:
  enabled: true
  update_interval: 1
  show_plot: true
  save_plot: true
  format: png
  figsize: [14, 10]

seed: 2023
compare_all: true

strategies:
  - fedavg
  - fedprox
  - scaffold
  - hybrid

verbose: true

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
