# Federated Disposable Income Regression Configuration
# =============================================================================
# v4 ENHANCED HYBRID CONFIGURATION
#
# Building on v3's success (winning 5/6 metrics), v4 adds:
# - Loss-aware adaptive scheduling
# - EMA for control variates
# - Gradient projection
# - Phase-adaptive learning rate
#
# v3 Results (baseline to beat):
#   Hybrid: RMSE=$3,788, R²=0.8976, MAPE=5.64%, Acc@10%=86.61%, Acc@20%=96.19%
#
# =============================================================================

num_rounds: 40
num_clients: 12
local_epochs: 3
batch_size: 32
learning_rate: 0.0012 # Slightly higher base LR (will be adjusted by phase)

client_sampling:
  fraction_fit: 0.75 # Slightly higher participation
  min_fit_clients: 6
  fraction_evaluate: 0.5
  min_evaluate_clients: 2
  min_available_clients: 6

fedprox:
  mu: 0.1

scaffold:
  learning_rate_correction: 1.0

# =============================================================================
# v4 HYBRID STRATEGY PARAMETERS
# =============================================================================
hybrid:
  mu: 0.08
  fedprox_weight: 0.75 # Slightly increased from 0.7
  scaffold_weight: 0.85 # Slightly decreased from 0.9 for balance

  warmup_rounds: 2
  warmup_type: "linear"
  warmup_start_factor: 0.1

  use_warm_start: true
  baseline_divergence: 1.0

  # v4 NEW: Enable EMA for control variates
  use_control_ema: true
  control_ema_beta: 0.95

  gradient_clip: true
  gradient_clip_norm: 1.0

strategy_configs:
  fedavg:
    lr: 0.001
    local_epochs: 3
    max_grad_norm: 1.0

  fedprox:
    lr: 0.001
    local_epochs: 3
    max_grad_norm: 1.0

  scaffold:
    lr: 0.001
    local_epochs: 3
    max_grad_norm: 1.0

  hybrid:
    lr: 0.0012
    local_epochs: 3
    max_grad_norm: 1.0

iid: false
partition_strategy: hybrid

plotting:
  enabled: true
  update_interval: 1
  show_plot: true
  save_plot: true
  format: png
  figsize: [14, 10]

seed: 2023
compare_all: true

strategies:
  - fedavg
  - fedprox
  - scaffold
  - hybrid

verbose: true

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
