# Federated Disposable Income Regression Configuration
# =============================================================================
# v3 ADVANCED HYBRID CONFIGURATION
#
# This configuration is designed for the v3 client implementation which includes:
# 1. Three-phase scheduling (exploration → transition → convergence)
# 2. Per-client adaptive μ based on divergence
# 3. Gradient variance-based SCAFFOLD strength
# 4. Layer-wise correction scaling
# 5. Optional warm-start for control variates
#
# =============================================================================

num_rounds: 40 # Extended for three-phase to fully develop
num_clients: 12
local_epochs: 3
batch_size: 32
learning_rate: 0.001 # Slightly lower for stability with adaptive corrections

client_sampling:
  fraction_fit: 0.7 # Higher participation for better convergence
  min_fit_clients: 5
  fraction_evaluate: 0.5
  min_evaluate_clients: 2
  min_available_clients: 5

fedprox:
  mu: 0.1

scaffold:
  learning_rate_correction: 1.0

# =============================================================================
# v3 HYBRID STRATEGY PARAMETERS
# =============================================================================
#
# KEY PARAMETERS:
#
# mu: 0.08
#   - Base proximal term weight
#   - Will be scaled by per-client divergence (0.5x to 2.0x)
#   - Will be scaled by phase (0.0 → 0.8 over training)
#
# fedprox_weight: 0.7
#   - Global scaling factor for FedProx component
#   - Combined with phase-based scaling
#
# scaffold_weight: 0.9
#   - Global scaling factor for SCAFFOLD component
#   - Combined with variance-based and layer-wise scaling
#
# warmup_rounds: 2
#   - Initial rounds with minimal corrections
#   - Allows model to establish baseline before corrections kick in
#
# PHASE BREAKDOWN (for 40 rounds):
#   Warmup (1-2): SCAFFOLD 0→0.3, FedProx 0
#   Exploration (3-13): SCAFFOLD 1.0, FedProx 0.1
#   Transition (14-30): SCAFFOLD 1.0→0.7, FedProx 0.1→0.5
#   Convergence (31-40): SCAFFOLD 0.7→0.5, FedProx 0.5→0.8
#
hybrid:
  mu: 0.08
  fedprox_weight: 0.7
  scaffold_weight: 0.9

  warmup_rounds: 2
  warmup_type: "linear"
  warmup_start_factor: 0.1

  # v3: Enable warm-start initialization for control variates
  use_warm_start: true

  # v3: Baseline divergence for per-client adaptive mu
  # Tune this based on your observed divergence values
  baseline_divergence: 1.0

  gradient_clip: true
  gradient_clip_norm: 1.0

strategy_configs:
  fedavg:
    lr: 0.001
    local_epochs: 3
    max_grad_norm: 1.0

  fedprox:
    lr: 0.001
    local_epochs: 3
    max_grad_norm: 1.0

  scaffold:
    lr: 0.001
    local_epochs: 3
    max_grad_norm: 1.0

  hybrid:
    lr: 0.001
    local_epochs: 3
    max_grad_norm: 1.0

iid: false
partition_strategy: hybrid

plotting:
  enabled: true
  update_interval: 1
  show_plot: true
  save_plot: true
  format: png
  figsize: [14, 10]

seed: 2023
compare_all: true

# Run all 4 strategies in a SINGLE run for fair comparison
strategies:
  - fedavg
  - fedprox
  - scaffold
  - hybrid

verbose: true

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
