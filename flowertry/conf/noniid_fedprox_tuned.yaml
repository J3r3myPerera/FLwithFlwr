---
# TUNED Non-IID + FedProx
# Optimized hyperparameters for heterogeneous data

num_rounds: 20
num_clients: 10
batch_size: 16  # Smaller batch for better generalization

num_clients_per_round_fit: 8  # More clients per round
num_clients_per_round_eval: 10

# Extreme Non-IID Partitioning
partition_type: "dirichlet"
dirichlet_alpha: 0.1

# FedProx with tuned μ
strategy: "fedprox"
fedprox_mu: 0.005  # Lower μ for less aggressive regularization

config_fit:
  lr: 0.005         # Lower learning rate for stability
  momentum: 0.9
  local_epochs: 3   # Fewer local epochs to reduce drift
  weight_decay: 0.0001
