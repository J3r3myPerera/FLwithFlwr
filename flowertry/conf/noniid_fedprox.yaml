---
# Non-IID + FedProx
# Heterogeneous data - FedProx with TUNED proximal term

num_rounds: 15
num_clients: 10
batch_size: 32

num_clients_per_round_fit: 5
num_clients_per_round_eval: 10

# High Non-IID Partitioning (same as FedAvg for fair comparison)
partition_type: "dirichlet"
dirichlet_alpha: 0.1

# FedProx Strategy with REDUCED mu (0.01 instead of 0.1)
# Too high mu causes over-regularization and slower learning
strategy: "fedprox"
fedprox_mu: 0.01

config_fit:
  lr: 0.01
  momentum: 0.9
  local_epochs: 5
