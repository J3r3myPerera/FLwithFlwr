num_rounds: 40
num_clients: 12
local_epochs: 5
batch_size: 16
learning_rate: 0.0015
client_subsample_ratio: 0.35
use_engineered_features: false
client_sampling:
  fraction_fit: 0.35
  min_fit_clients: 3
  fraction_evaluate: 0.35
  min_evaluate_clients: 2
  min_available_clients: 4
fedprox:
  mu: 0.1
scaffold:
  learning_rate_correction: 1.0
hybrid:
  mu: 0.1
  fedprox_weight: 0.85
  scaffold_weight: 0.9
  warmup_rounds: 3
  warmup_type: linear
  warmup_start_factor: 0.1
  use_warm_start: true
  baseline_divergence: 1.0
  use_control_ema: true
  control_ema_beta: 0.92
  gradient_clip: true
  gradient_clip_norm: 1.2
strategy_configs:
  fedavg:
    lr: 0.001
    local_epochs: 5
    max_grad_norm: 1.0
  fedprox:
    lr: 0.001
    local_epochs: 5
    max_grad_norm: 1.0
  scaffold:
    lr: 0.001
    local_epochs: 5
    max_grad_norm: 1.0
  hybrid:
    lr: 0.0015
    local_epochs: 5
    max_grad_norm: 1.2
iid: false
partition_strategy: hybrid
plotting:
  enabled: true
  update_interval: 1
  show_plot: true
  save_plot: true
  format: png
  figsize:
  - 14
  - 10
seed: 2023
compare_all: true
strategies:
- fedavg
- fedprox
- scaffold
- hybrid
verbose: true
