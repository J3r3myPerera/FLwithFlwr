strategy: compare
num_rounds: 50
num_clients: 3
batch_size: 32
input_dim: 19
num_clients_per_round_fit: 3
num_clients_per_round_eval: 3
non_iid: true
alpha: 0.1
config_fit:
  lr: 0.001
  momentum: 0.0
  local_epochs: 5
fedprox_base:
  mu: 0.15
  lr: 0.0008
  name: Base FedProx (μ=0.15)
fedprox_multilayer:
  mu: 0.01
  lr: 0.0012
  layer_mus:
    input: 0.003
    hidden1: 0.008
    hidden2: 0.012
    output: 0.025
  name: Multi-Layer FedProx
plotting:
  save_plots: true
  plot_format: png
  figsize:
  - 12
  - 8
  dpi: 300
data_path: ./data/IndianPersonalFinance/indianPersonalFinanceAndSpendingHabits.csv
