strategy: compare
num_rounds: 20
num_clients: 12
batch_size: 32
input_dim: 19
num_clients_per_round_fit: 6
num_clients_per_round_eval: 6
non_iid: true
alpha: 0.5
config_fit:
  lr: 0.001
  momentum: 0.0
  local_epochs: 5
fedprox_base:
  mu: 0.01
  lr: 0.01
  name: Base FedProx (μ=0.01)
fedprox_multilayer:
  mu: 0.01
  lr: 0.01
  layer_mus:
    input: 0.25
    hidden1: 0.3
    hidden2: 0.35
    output: 0.4
  name: Multi-Layer FedProx (Aggressive)
plotting:
  save_plots: true
  plot_format: png
  figsize:
  - 12
  - 8
  dpi: 300
data_path: ./data/IndianPersonalFinance/indianPersonalFinanceAndSpendingHabits.csv
