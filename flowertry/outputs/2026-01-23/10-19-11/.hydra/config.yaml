strategy: compare_stratified
num_rounds: 20
num_clients: 12
batch_size: 32
input_dim: 19
num_clients_per_round_fit: 6
num_clients_per_round_eval: 6
non_iid: true
use_stratified_selection: true
min_clients_per_stratum: 1
alpha: 0.3
config_fit:
  lr: 0.001
  momentum: 0.0
  local_epochs: 5
fedprox_base:
  mu: 0.1
  lr: 0.01
  name: Base FedProx (μ=0.1)
fedprox:
  mu: 0.01
  lr: 0.001
  layer_mus:
    input: 0.003
    hidden1: 0.008
    hidden2: 0.012
    output: 0.025
  name: FedProx
fedprox_multilayer:
  mu: 0.01
  lr: 0.01
  layer_mus:
    input: 0.25
    hidden1: 0.3
    hidden2: 0.35
    output: 0.4
  name: Static Multi-Layer FedProx
fedprox_adaptive:
  schedule_type: cosine
  min_schedule_factor: 0.2
  warmup_rounds: 3
  use_divergence: true
  divergence_weight: 0.6
  min_mu: 0.005
  max_mu: 0.3
  name: Adaptive Multi-Layer FedProx
plotting:
  save_plots: true
  plot_format: png
  figsize:
  - 12
  - 8
  dpi: 300
data_path: ./data/IndianPersonalFinance/indianPersonalFinanceAndSpendingHabits.csv
