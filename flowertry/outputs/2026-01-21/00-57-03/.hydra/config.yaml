num_rounds: 30
num_clients: 12
local_epochs: 3
batch_size: 32
learning_rate: 0.0012
client_sampling:
  fraction_fit: 0.8
  min_fit_clients: 6
  fraction_evaluate: 0.7
  min_evaluate_clients: 3
  min_available_clients: 6
fedprox:
  mu: 0.1
scaffold:
  learning_rate_correction: 1.0
hybrid:
  mu: 0.1
  hybrid_mode: orthogonal
  warmup_rounds: 7
  scaffold_mu_reduction: 0.4
  fedprox_weight: 1.0
  scaffold_weight: 1.0
strategy_configs:
  fedavg:
    lr: 0.001
    local_epochs: 3
    max_grad_norm: 1.0
    momentum: 0.0
  fedprox:
    lr: 0.001
    local_epochs: 3
    max_grad_norm: 1.0
    momentum: 0.0
  scaffold:
    lr: 0.001
    local_epochs: 3
    max_grad_norm: 1.0
    momentum: 0.0
  hybrid:
    lr: 0.0012
    local_epochs: 3
    max_grad_norm: 1.2
    momentum: 0.0
iid: false
partition_strategy: hybrid
plotting:
  enabled: true
  update_interval: 1
  show_plot: true
  save_plot: true
  format: png
  figsize:
  - 14
  - 10
seed: 2023
compare_all: true
strategies:
- hybrid
verbose: true
