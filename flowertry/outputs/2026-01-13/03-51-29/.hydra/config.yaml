num_rounds: 50
num_clients: 20
batch_size: 8
num_classes: 4
discretization_method: quantile
num_clients_per_round_fit: 5
num_clients_per_round_eval: 5
iid: false
alpha: 0.3
use_class_weights: true
class_weight_method: balanced
proximal_mu: 0.5
scaffold_server_lr: 0.5
adaptive_mu:
  enabled: true
  mode: multi_signal
  initial_mu: 0.01
  mu_min: 0.001
  mu_max: 0.5
  increase_factor: 1.3
  decrease_factor: 0.9
  loss_threshold: 0.01
  warmup_rounds: 3
multi_signal_mu:
  base_mu: 0.3
  mu_min: 0.05
  mu_max: 2.0
  smoothing_factor: 0.7
  warmup_rounds: 3
  weights:
    gradient_divergence: 0.4
    loss_variance: 0.25
    label_entropy: 0.2
    feature_variance: 0.15
strategies:
- fedavg
- fedprox
config_fit:
  lr: 0.005
  momentum: 0.9
  local_epochs: 3
  max_grad_norm: 1.0
strategy_configs:
  fedavg:
    lr: 0.01
    momentum: 0.5
    local_epochs: 3
    max_grad_norm: 1.0
  fedprox:
    lr: 0.01
    momentum: 0.9
    local_epochs: 5
    max_grad_norm: 2.0
  fedscaffold:
    lr: 0.005
    momentum: 0.5
    local_epochs: 3
    max_grad_norm: 1.0
