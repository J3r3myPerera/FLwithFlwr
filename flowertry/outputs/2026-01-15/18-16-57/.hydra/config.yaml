strategy: hybrid
num_rounds: 10
num_clients: 3
local_epochs: 5
batch_size: 32
learning_rate: 0.01
fedprox:
  mu: 0.1
scaffold:
  learning_rate_correction: 1.0
hybrid:
  fedprox_weight: 0.3
  scaffold_weight: 0.5
  mu: 0.08
  adaptive_mu: true
  mu_decay: 0.98
  mu_min: 0.001
  warmup_rounds: 5
  warmup_factor: 0.3
  use_lr_scheduler: true
  lr_decay: 0.995
  lr_min: 0.001
iid: false
plotting:
  enabled: true
  update_interval: 1
  show_plot: true
  save_plot: true
  format: png
  figsize:
  - 14
  - 10
seed: 2023
compare_all: true
strategies:
- fedavg
- hybrid
verbose: true
